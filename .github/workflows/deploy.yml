name: Test and deploy Hearth

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hearth-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python requirements and Chinese PDF font
        run: |
          python3 -m pip install -r requirements-test.txt
          scripts/install-office-font.sh "$RUNNER_TEMP/hearth-fonts"
          echo "HEARTH_CJK_FONT=$RUNNER_TEMP/hearth-fonts/wqy-microhei.ttc" >> "$GITHUB_ENV"
      - name: Python tests
        run: python3 -m unittest discover -s tests
      - name: Node tests
        run: node --test tests/*.test.mjs
      - name: JavaScript syntax
        run: for f in web/*.js; do node --check "$f"; done

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('requirements.txt') }}
      - name: Install Python requirements
        run: python -m pip install -r requirements-test.txt
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Offline Chromium smoke
        env:
          PYTHONPATH: .
        run: timeout 85s python tests/browser-smoke.py
      - name: Chat stream disconnect recovery
        env:
          PYTHONPATH: .
        run: timeout 85s python tests/browser-smoke.py --disconnect

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, browser-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
      HEARTH_SPRITE_ORG: ${{ vars.HEARTH_SPRITE_ORG }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when no Sprites token is set
        if: env.SPRITES_TOKEN == ''
        run: echo "::notice::Add the SPRITES_TOKEN repository secret to enable deploys."
      - name: Install the Sprites CLI
        if: env.SPRITES_TOKEN != ''
        run: |
          curl -fsSL https://sprites.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Authenticate
        if: env.SPRITES_TOKEN != ''
        run: sprite auth setup --token "$SPRITES_TOKEN" > /dev/null
      - name: Deploy to the Hearth Sprite
        if: env.SPRITES_TOKEN != ''
        run: scripts/deploy.sh
