name: Deploy to my Sprite

on:
  workflow_dispatch:
    inputs:
      sprite_name:
        description: Sprite name
        type: string
        required: true
        default: hearth
      org:
        description: Fly organization slug (optional)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: hearth-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEARTH_SPRITE_NAME: ${{ inputs.sprite_name }}
      HEARTH_SPRITE_ORG: ${{ inputs.org || vars.HEARTH_SPRITE_ORG }}
    steps:
      - name: Check deployment inputs
        shell: bash
        env:
          SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
        run: |
          if [[ -z "$SPRITES_TOKEN" ]]; then
            echo '::error::Add the SPRITES_TOKEN repository secret under Settings → Secrets and variables → Actions, then run this workflow again.'
            exit 1
          fi
          if [[ ! "$HEARTH_SPRITE_NAME" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo '::error::Enter a Sprite name with lowercase letters, digits, and hyphens. Start with a letter or digit.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the Sprites CLI
        shell: bash
        run: |
          curl -fsSL https://sprites.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Authenticate
        env:
          SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
        run: |
          if ! sprite auth setup --token "$SPRITES_TOKEN" >/dev/null 2>&1; then
            echo '::error::Sprites authentication setup failed. Check the SPRITES_TOKEN repository secret.'
            exit 1
          fi
      - name: Prepare the private Sprite
        shell: bash
        run: |
          org=()
          if [[ -n "$HEARTH_SPRITE_ORG" ]]; then
            org=(-o "$HEARTH_SPRITE_ORG")
          fi
          status=$(sprite api "${org[@]}" "/v1/sprites/$HEARTH_SPRITE_NAME" -- \
            --silent --max-time 30 --output /dev/null --write-out '%{http_code}' 2>/dev/null) || status=
          case "$status" in
            200) ;;
            404)
              if ! sprite create "${org[@]}" "$HEARTH_SPRITE_NAME" --skip-console >/dev/null 2>&1; then
                echo '::error::Could not create the Sprite. Check Sprite creation permissions and name availability in Fly.'
                exit 1
              fi
              ;;
            *)
              echo '::error::Could not look up the Sprite. Check the token permissions and the Fly organization.'
              exit 1
              ;;
          esac
          if ! sprite config update "${org[@]}" -s "$HEARTH_SPRITE_NAME" --url-auth sprite >/dev/null 2>&1; then
            echo '::error::Could not set Sprite URL authentication. Check the Sprite settings and token permissions in Fly.'
            exit 1
          fi
      - name: Deploy Hearth
        run: |
          if ! scripts/deploy.sh >/dev/null 2>&1; then
            echo '::error::Hearth deployment failed. Check the Sprite and its services in the Fly dashboard.'
            exit 1
          fi
      - name: Probe Hearth health
        shell: bash
        run: |
          org=()
          if [[ -n "$HEARTH_SPRITE_ORG" ]]; then
            org=(-o "$HEARTH_SPRITE_ORG")
          fi
          if ! sprite exec --http-post --no-stdin --no-port-forward "${org[@]}" -s "$HEARTH_SPRITE_NAME" -- \
              curl --noproxy '*' --fail --silent --max-time 10 --output /dev/null http://127.0.0.1:8080/health \
              >/dev/null 2>&1; then
            echo '::error::Hearth did not pass the health probe. Check the web service in the Fly dashboard.'
            exit 1
          fi
      - name: Write deployment summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Hearth is ready

          1. Open your Sprite from the [Fly dashboard](https://fly.io/dashboard).
          2. In Fly, open **Sprites → Connectors**, add Hugging Face or other providers, and grant your Sprite access.
          3. In Hearth, open **Settings → Connections** and select **Refresh**.
          EOF
